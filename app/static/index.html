<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多评委评分校准</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <h1>多评委评分校准</h1>
  <div class="session-info">
    <span>会话：<code id="session-id"></code></span>
    <button id="btn-clear" class="btn btn-ghost" title="清空当前会话的全部数据与裁决">清空会话</button>
  </div>
</header>

<main>
  <!-- 1. 数据导入 -->
  <section class="card" id="panel-import">
    <h2>① 数据导入</h2>
    <p class="hint">
      CSV 需包含四列：<b>选手</b>、<b>评委</b>、<b>项目</b>、<b>分数</b>（中英文表头均可，如 contestant/judge/item/score）。
      同一「选手 × 评委 × 项目」仅允许一条分数。
    </p>
    <div class="toolbar">
      <label class="btn btn-primary">
        上传 CSV
        <input type="file" id="file-input" accept=".csv,text/csv" hidden>
      </label>
      <button id="btn-sample" class="btn">载入示例数据</button>
      <div class="scope-switch">
        校准范围：
        <label><input type="radio" name="scope" value="judge" checked> 按评委（跨项目汇总）</label>
        <label><input type="radio" name="scope" value="judge_item"> 按评委×项目</label>
      </div>
      <span id="import-msg" class="msg"></span>
    </div>
  </section>

  <!-- 空状态 -->
  <section id="empty-state" class="card empty">
    <p>📄 暂无数据。请上传 CSV 或点击「载入示例数据」开始。</p>
  </section>

  <div id="dashboard" hidden>
    <!-- 2. 校准参数与反转 -->
    <section class="card">
      <h2>② 稳健标准化与名次反转</h2>
      <div id="reference-info" class="formula"></div>
      <div id="stats-row" class="stats"></div>
      <h3 class="sub">校准分组参数</h3>
      <div id="group-table-wrap" class="table-wrap"></div>
      <h3 class="sub">名次反转 <span id="reversal-count" class="badge"></span></h3>
      <div id="reversal-panel"></div>
    </section>

    <!-- 3. 排名总表 -->
    <section class="card">
      <h2>③ 选手排名（实时）</h2>
      <div class="toolbar">
        <button id="btn-reset-decisions" class="btn btn-ghost">全部恢复采用校准分</button>
        <button id="btn-export" class="btn btn-primary">导出审计 CSV</button>
      </div>
      <div id="rank-table-wrap" class="table-wrap"></div>
    </section>

    <!-- 4. 逐项裁决 -->
    <section class="card">
      <h2>④ 逐项评分裁决</h2>
      <p class="hint">对每条原始评分选择「采用校准分」或「保留原分」并填写理由，排名将实时重算。</p>
      <div id="detail-panel"></div>
    </section>
  </div>
</main>

<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
